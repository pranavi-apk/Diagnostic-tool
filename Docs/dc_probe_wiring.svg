<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="system-ui, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="820" height="520" fill="#f8f9fb"/>
  <text x="410" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">DC Probe  Your Parts (47k + 10k+2k)</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#555">Open this file in Chrome/Safari: Docs/dc_probe_wiring.svg</text>

  <!-- STM32 box -->
  <rect x="560" y="120" width="210" height="200" rx="8" fill="#e8ecf4" stroke="#4a5568" stroke-width="2"/>
  <text x="665" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">Your diagnostic board</text>
  <text x="665" y="172" text-anchor="middle" font-size="13" fill="#333">STM32F103</text>
  <circle cx="600" cy="220" r="10" fill="#2d6cdf"/>
  <text x="618" y="225" font-size="14" font-weight="bold" fill="#1a1a2e">PC0</text>
  <text x="618" y="242" font-size="11" fill="#666">ADC sense wire</text>
  <circle cx="600" cy="268" r="10" fill="#333"/>
  <text x="618" y="273" font-size="14" font-weight="bold" fill="#1a1a2e">GND</text>
  <text x="618" y="290" font-size="11" fill="#666">black probe + R2 end</text>
  <text x="665" y="300" text-anchor="middle" font-size="11" fill="#888">(optional later: PC2 via 100k to NODE)</text>

  <!-- Red probe -->
  <ellipse cx="70" cy="200" rx="48" ry="28" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="70" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">RED</text>
  <text x="70" y="212" text-anchor="middle" font-size="11" fill="#991b1b">probe tip</text>

  <!-- Black probe -->
  <ellipse cx="70" cy="380" rx="48" ry="28" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="70" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">BLACK</text>
  <text x="70" y="392" text-anchor="middle" font-size="11" fill="#444">probe tip</text>

  <!-- R1 47k -->
  <line x1="118" y1="200" x2="280" y2="200" stroke="#dc2626" stroke-width="3"/>
  <rect x="165" y="172" width="90" height="52" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="210" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">47 k©</text>
  <text x="210" y="212" text-anchor="middle" font-size="11" fill="#9a3412">R1 (one resistor)</text>

  <!-- NODE -->
  <circle cx="320" cy="200" r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
  <text x="320" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">NODE</text>
  <text x="320" y="212" text-anchor="middle" font-size="10" fill="#854d0e">junction</text>

  <!-- Wire PC0 -->
  <path d="M 342 200 L 588 220" stroke="#2d6cdf" stroke-width="3" fill="none"/>
  <text x="460" y="188" text-anchor="middle" font-size="12" fill="#2d6cdf" font-weight="bold">wire to PC0 only</text>

  <!-- Cap -->
  <line x1="320" y1="222" x2="320" y2="268" stroke="#059669" stroke-width="2"/>
  <rect x="292" y="268" width="56" height="44" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="320" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">C1</text>
  <text x="320" y="302" text-anchor="middle" font-size="10" fill="#047857">100nF*</text>
  <line x1="320" y1="312" x2="320" y2="360" stroke="#059669" stroke-width="2"/>
  <line x1="320" y1="360" x2="120" y2="380" stroke="#374151" stroke-width="2"/>
  <text x="230" y="352" font-size="11" fill="#059669">to GND (optional cap)</text>

  <!-- R2 10k + 2k -->
  <line x1="320" y1="222" x2="320" y2="280" stroke="#111" stroke-width="2"/>
  <line x1="320" y1="280" x2="200" y2="320" stroke="#111" stroke-width="2"/>
  <rect x="120" y="298" width="95" height="44" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="167" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">10 k©</text>
  <text x="167" y="332" text-anchor="middle" font-size="10" fill="#9a3412">+ 2 k©</text>
  <text x="167" y="352" text-anchor="middle" font-size="10" fill="#9a3412">(in series)</text>
  <text x="240" y="318" font-size="11" fill="#333">= 12 k© to GND</text>

  <!-- GND bus -->
  <line x1="118" y1="380" x2="588" y2="268" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="350" y="335" font-size="12" fill="#333">BLACK lead ’ board GND</text>
  <text x="350" y="352" font-size="11" fill="#666">When testing another board: black to THAT board GND too</text>

  <!-- Target -->
  <rect x="40" y="420" width="340" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="210" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">Board you are testing (later)</text>
  <text x="210" y="472" text-anchor="middle" font-size="12" fill="#6d28d9">RED ’ voltage (3.3V / 5V / 12V)  "  BLACK ’ that board GND</text>

  <!-- Steps box -->
  <rect x="400" y="380" width="370" height="120" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="415" y="402" font-size="13" font-weight="bold" fill="#1e293b">You already did: 10k + 2k in series </text>
  <text x="415" y="424" font-size="12" fill="#334155">1. Join one end of that string to NODE (with 47k and PC0)</text>
  <text x="415" y="444" font-size="12" fill="#334155">2. Other end of string ’ GND (same as black wire)</text>
  <text x="415" y="464" font-size="12" fill="#334155">3. 47k: RED tip ” NODE  "  Cap: NODE ” GND</text>
  <text x="415" y="484" font-size="12" fill="#334155">4. Power ON ’ DC PROBE menu ’ PROBE CAL 3300 on 3.3V</text>
  <text x="415" y="502" font-size="11" fill="#64748b">*Cap: use 100nF if you have it; no cap OK for first try</text>
</svg>